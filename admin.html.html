<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | مطبخ إيمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --noir:#3B5878; --gold:#F0796B; --gold-soft:#F5988D;
    --ivory:#FDEEDD; --paper:#FFFBF5; --ink:#4A3226; --ink-soft:#8A7364;
    --line-gold:rgba(240,121,107,.35); --line-ink:#F1DFCB;
    --green:#3E5C3A; --red:#9E3B2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Cairo',sans-serif;line-height:1.6;min-height:100vh;}
  h1,h2{margin:0;font-family:'Cairo',sans-serif;}
  .nums{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  button,input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---- Login screen ---- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--noir);padding:20px;
  }
  .login-box{
    background:rgba(244,238,223,.03);border:1px solid var(--line-gold);border-radius:6px;
    padding:36px 30px;width:100%;max-width:360px;text-align:center;
  }
  .login-logo{width:64px;height:64px;border-radius:50%;overflow:hidden;margin:0 auto 16px;}
  .login-logo img{width:100%;height:100%;object-fit:cover;}
  .login-box h1{color:var(--ivory);font-size:1.5rem;margin-bottom:6px;}
  .login-box p{color:rgba(244,238,223,.55);font-size:.85rem;margin-bottom:26px;}
  .login-box label{display:block;text-align:start;font-size:.8rem;font-weight:700;color:var(--gold-soft);margin-bottom:6px;}
  .login-box input{
    width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line-gold);
    background:rgba(244,238,223,.05);color:var(--ivory);margin-bottom:16px;font-size:.9rem;
  }
  .login-box button{
    width:100%;background:var(--gold);color:var(--noir);border:none;padding:13px;
    border-radius:14px;font-weight:700;font-size:.9rem;cursor:pointer;
  }
  .login-box button:hover{background:var(--gold-soft);}
  .login-error{color:#E08A7A;font-size:.8rem;margin-top:12px;min-height:1em;}

  /* ---- Dashboard ---- */
  #dashboard{display:none;}
  header.top{
    background:var(--noir);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:5;
  }
  header.top h1{color:var(--ivory);font-size:1.15rem;}
  .logout-btn{
    background:transparent;border:1px solid var(--gold);color:var(--gold-soft);
    padding:8px 16px;border-radius:14px;font-size:.82rem;font-weight:600;cursor:pointer;
  }
  .logout-btn:hover{background:var(--gold);color:var(--noir);}

  .main-tabs{display:flex;gap:0;max-width:900px;margin:0 auto;padding:0 24px;border-bottom:1px solid var(--line-ink);}
  .main-tab{
    background:none;border:none;padding:14px 4px;margin-inline-end:26px;font-weight:700;font-size:.92rem;
    color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer;
  }
  .main-tab.active{color:var(--ink);border-bottom-color:var(--gold);}
  .view{display:none;}
  .view.active{display:block;}

  .stats{display:flex;gap:14px;padding:20px 24px 0;flex-wrap:wrap;}
  .stat{
    background:var(--paper);border:1px solid var(--line-ink);border-radius:5px;padding:14px 18px;flex:1;min-width:130px;
  }
  .stat .n{font-size:1.5rem;font-weight:800;color:var(--gold);}
  .stat .l{font-size:.76rem;color:var(--ink-soft);margin-top:2px;}

  .filters{display:flex;gap:8px;padding:18px 24px 0;flex-wrap:wrap;}
  .filter-btn{
    background:transparent;border:1px solid var(--line-ink);color:var(--ink-soft);
    padding:7px 14px;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;
  }
  .filter-btn.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  #ordersList{padding:18px 24px 60px;display:flex;flex-direction:column;gap:14px;max-width:900px;margin:0 auto;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;}

  .order-card{
    background:var(--paper);border:1px solid var(--line-ink);border-radius:6px;padding:18px 20px;
  }
  .oc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .oc-id{font-weight:800;font-size:.95rem;}
  .oc-time{font-size:.76rem;color:var(--ink-soft);}
  .badge{
    padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;
  }
  .badge.received{background:#E9E2CF;color:#7A6A3D;}
  .badge.preparing{background:#F0DFC0;color:#8A5A1E;}
  .badge.out_for_delivery{background:#DCE7DA;color:var(--green);}
  .badge.delivered{background:#D8E8DC;color:#2C5A2C;}

  .oc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  @media (max-width:560px){.oc-grid{grid-template-columns:1fr;}}
  .oc-block h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .oc-block p{font-size:.86rem;margin:0 0 2px;}
  .items-line{font-size:.85rem;padding:2px 0;display:flex;justify-content:space-between;}
  .oc-total{font-weight:800;color:var(--gold);font-size:.95rem;}

  .oc-note{
    background:#FBF3E4;border-inline-start:3px solid var(--gold);padding:8px 12px;font-size:.83rem;
    margin-bottom:14px;color:#6E5A2E;border-radius:14px;
  }

  .oc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    border-top:1px solid var(--line-ink);padding-top:14px;}
  .status-select{
    padding:8px 12px;border-radius:16px;border:1px solid var(--line-ink);background:var(--paper);font-size:.85rem;font-weight:600;
  }
  .wa-link{
    color:var(--green);font-size:.82rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:5px;
  }
  .wa-link:hover{text-decoration:underline;}
  .track-link{color:var(--ink-soft);font-size:.78rem;text-decoration:none;}
  .track-link:hover{color:var(--gold);}

  /* ---- Menu management ---- */
  #menuView{padding:20px 24px 60px;max-width:900px;margin:0 auto;}
  .menu-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .add-item-btn{
    background:var(--gold);color:var(--noir);border:none;padding:10px 20px;border-radius:16px;
    font-weight:700;font-size:.85rem;cursor:pointer;
  }
  .add-item-btn:hover{background:var(--gold-soft);}

  .menu-cat-group{margin-bottom:26px;}
  .menu-cat-title{font-size:.95rem;font-weight:800;color:var(--ink);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line-ink);}

  .menu-item-row{
    display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px dotted var(--line-ink);
  }
  .mi-info{flex:1;min-width:0;}
  .mi-name{font-weight:700;font-size:.92rem;}
  .mi-desc{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}
  .mi-price{font-weight:700;color:var(--gold);font-size:.9rem;white-space:nowrap;}
  .mi-actions{display:flex;gap:8px;}
  .icon-btn{
    background:transparent;border:1px solid var(--line-ink);width:32px;height:32px;border-radius:16px;
    cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{border-color:var(--gold);}
  .icon-btn.danger:hover{border-color:var(--red);}
  .mi-unavailable{opacity:.45;}
  .mi-unavailable .mi-name::after{content:" (متوقف)";color:var(--red);font-weight:600;font-size:.75rem;}

  /* ---- Item modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(23,19,15,.6);z-index:50;display:none;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--paper);border-radius:8px;padding:26px;width:100%;max-width:440px;
    max-height:88vh;overflow-y:auto;
  }
  .modal h2{font-size:1.2rem;margin-bottom:18px;font-family:'Cairo',sans-serif;}
  .mfield{margin-bottom:14px;}
  .mfield label{display:block;font-size:.8rem;font-weight:700;margin-bottom:5px;color:var(--ink);}
  .mfield input, .mfield textarea, .mfield select{
    width:100%;padding:10px 11px;border-radius:16px;border:1px solid var(--line-ink);
    background:var(--paper);font-family:inherit;font-size:.88rem;color:var(--ink);
  }
  .mfield textarea{min-height:56px;resize:vertical;}
  .mfield-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mfield-check{display:flex;align-items:center;gap:8px;}
  .mfield-check input{width:auto;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions button{
    flex:1;padding:12px;border-radius:16px;font-weight:700;font-size:.87rem;cursor:pointer;border:none;
  }
  .save-btn{background:var(--gold);color:var(--noir);}
  .save-btn:hover{background:var(--gold-soft);}
  .cancel-btn{background:transparent;border:1px solid var(--line-ink) !important;color:var(--ink-soft);}
  .modal-error{color:var(--red);font-size:.8rem;margin-top:6px;min-height:1em;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><img src="logo.png" alt="مطبخ إيمي"></div>
    <h1>مطبخ إيمي</h1>
    <p style="color:var(--gold-soft);font-size:.8rem;margin-top:-16px;margin-bottom:20px;">لوحة التحكم</p>
    <p>سجّل دخولك عشان تشوف الطلبات</p>
    <label>الإيميل</label>
    <input type="email" id="loginEmail" placeholder="you@example.com">
    <label>كلمة المرور</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button id="loginBtn" type="button">دخول</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <h1>لوحة تحكم الطلبات</h1>
    <button class="logout-btn" id="logoutBtn" type="button">تسجيل خروج</button>
  </header>

  <div class="main-tabs">
    <button class="main-tab active" data-view="ordersView">الطلبات</button>
    <button class="main-tab" data-view="menuView">المنيو</button>
  </div>

  <div id="ordersView" class="view active">
    <div class="stats" id="stats"></div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-f="all">الكل</button>
      <button class="filter-btn" data-f="received">تم الاستلام</button>
      <button class="filter-btn" data-f="preparing">جاري التحضير</button>
      <button class="filter-btn" data-f="out_for_delivery">خرج للتوصيل</button>
      <button class="filter-btn" data-f="delivered">تم التوصيل</button>
    </div>

    <div id="ordersList"><div class="empty">جاري تحميل الطلبات...</div></div>
  </div>

  <div id="menuView" class="view">
    <div class="menu-toolbar">
      <div style="color:var(--ink-soft);font-size:.85rem">تحكم في أصناف المنيو اللي ظاهرة للعملاء</div>
      <button class="add-item-btn" id="addItemBtn" type="button">+ إضافة صنف جديد</button>
    </div>
    <div id="menuGroups"><div class="empty">جاري تحميل المنيو...</div></div>
  </div>
</div>

<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <h2 id="modalTitle">إضافة صنف جديد</h2>
    <div class="mfield">
      <label>التصنيف</label>
      <select id="f-cat">
        <option value="appetizers">مقبلات</option>
        <option value="mains">أطباق رئيسية</option>
        <option value="desserts">حلويات</option>
        <option value="drinks">مشروبات</option>
      </select>
    </div>
    <div class="mfield-row">
      <div class="mfield">
        <label>الاسم (عربي)</label>
        <input type="text" id="f-ar" placeholder="مثال: كشري">
      </div>
      <div class="mfield">
        <label>الاسم (إنجليزي)</label>
        <input type="text" id="f-en" placeholder="e.g. Koshari">
      </div>
    </div>
    <div class="mfield-row">
      <div class="mfield">
        <label>الوصف (عربي)</label>
        <textarea id="f-dar" placeholder="وصف قصير للصنف"></textarea>
      </div>
      <div class="mfield">
        <label>الوصف (إنجليزي)</label>
        <textarea id="f-den" placeholder="Short description"></textarea>
      </div>
    </div>
    <div class="mfield">
      <label>السعر (ج.م)</label>
      <input type="number" id="f-price" min="0" step="1" placeholder="0">
    </div>
    <div class="mfield mfield-check">
      <input type="checkbox" id="f-available" checked>
      <label for="f-available" style="margin:0">متاح للطلب دلوقتي</label>
    </div>
    <div class="modal-error" id="modalError"></div>
    <div class="modal-actions">
      <button class="cancel-btn" id="cancelItemBtn" type="button">إلغاء</button>
      <button class="save-btn" id="saveItemBtn" type="button">حفظ</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, query, orderByChild, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8h_w_JvoPV1PA5QFHJg_nAInFLCSEw9Y",
  authDomain: "emmie-s-kitchen.firebaseapp.com",
  databaseURL: "https://emmie-s-kitchen-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emmie-s-kitchen",
  storageBucket: "emmie-s-kitchen.firebasestorage.app",
  messagingSenderId: "381764506540",
  appId: "1:381764506540:web:58ee94ef5992661f1aa009"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);

const STAGES = [
  { key:'received', ar:"تم الاستلام" },
  { key:'preparing', ar:"جاري التحضير" },
  { key:'out_for_delivery', ar:"خرج للتوصيل" },
  { key:'delivered', ar:"تم التوصيل" }
];
const CURRENCY = "ج.م";

/* ---- تسجيل الدخول ---- */
document.getElementById('loginBtn').onclick = ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  signInWithEmailAndPassword(auth, email, password).catch(err=>{
    errBox.textContent = 'الإيميل أو كلمة المرور غلط، حاول تاني';
  });
};
document.getElementById('logoutBtn').onclick = ()=> signOut(auth);

let allOrders = [];
let activeFilter = 'all';

onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    listenToOrders();
    listenToMenu();
    seedMenuIfEmpty();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }
});

/* ---- تبديل التبويبات ---- */
document.querySelectorAll('.main-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.view).classList.add('active');
  });
});

function listenToOrders(){
  const ordersQuery = query(ref(db, 'orders'), orderByChild('createdAt'));
  onValue(ordersQuery, (snapshot)=>{
    const data = snapshot.val() || {};
    allOrders = Object.entries(data).map(([id, o])=>({ id, ...o })).reverse();
    renderStats();
    renderOrders();
  });
}

function renderStats(){
  const box = document.getElementById('stats');
  const counts = { all: allOrders.length };
  STAGES.forEach(s=> counts[s.key] = allOrders.filter(o=>o.status===s.key).length);
  box.innerHTML = `
    <div class="stat"><div class="n nums">${counts.all}</div><div class="l">كل الطلبات</div></div>
    <div class="stat"><div class="n nums">${counts.received||0}</div><div class="l">تم الاستلام</div></div>
    <div class="stat"><div class="n nums">${counts.preparing||0}</div><div class="l">جاري التحضير</div></div>
    <div class="stat"><div class="n nums">${counts.out_for_delivery||0}</div><div class="l">خرج للتوصيل</div></div>
  `;
}

document.getElementById('filters').addEventListener('click',(e)=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.f;
  renderOrders();
});

function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString('ar-EG', { dateStyle:'medium', timeStyle:'short' });
}

function renderOrders(){
  const list = document.getElementById('ordersList');
  const orders = activeFilter === 'all' ? allOrders : allOrders.filter(o=>o.status===activeFilter);

  if(orders.length === 0){
    list.innerHTML = `<div class="empty">مفيش طلبات هنا لسه</div>`;
    return;
  }

  list.innerHTML = orders.map(o=>{
    const itemsHtml = (o.items||[]).map(it=>
      `<div class="items-line"><span>${it.qty} × ${it.ar}</span><span class="nums">${(it.price*it.qty).toFixed(2)} ${CURRENCY}</span></div>`
    ).join('');
    const statusOptions = STAGES.map(s=>
      `<option value="${s.key}" ${o.status===s.key?'selected':''}>${s.ar}</option>`
    ).join('');
    const waNumberOnly = (o.customerPhone||'').replace(/[^0-9]/g,'');
    const trackUrl = new URL('tracking.html', window.location.href).href + '?id=' + o.id;

    return `
    <div class="order-card">
      <div class="oc-top">
        <div>
          <div class="oc-id">#${o.id.slice(-6).toUpperCase()} — ${o.customerName||''}</div>
          <div class="oc-time">${fmtTime(o.createdAt)}</div>
        </div>
        <span class="badge ${o.status}">${(STAGES.find(s=>s.key===o.status)||{}).ar || o.status}</span>
      </div>

      <div class="oc-grid">
        <div class="oc-block">
          <h4>الأصناف</h4>
          ${itemsHtml}
        </div>
        <div class="oc-block">
          <h4>بيانات التوصيل</h4>
          <p>📞 ${o.customerPhone||'-'}</p>
          <p>📍 ${o.customerAddress||'-'}</p>
          <p>${o.distanceKm!=null ? 'المسافة: ' + Number(o.distanceKm).toFixed(1) + ' كم' : ''}</p>
          <p>💳 ${o.payMethod==='cash' ? 'كاش عند الاستلام' : 'فيزا عند الاستلام'}</p>
        </div>
      </div>

      ${o.note ? `<div class="oc-note">📝 ${o.note}</div>` : ''}

      <div class="oc-grid" style="margin-bottom:8px">
        <div class="oc-block">
          <p>الفرعي: ${(o.subtotal||0).toFixed(2)} ${CURRENCY}</p>
          <p>التوصيل: ${(o.deliveryFee||0).toFixed(2)} ${CURRENCY}</p>
          <p>الضريبة: ${(o.tax||0).toFixed(2)} ${CURRENCY}</p>
        </div>
        <div class="oc-block" style="text-align:end">
          <div class="oc-total nums">${(o.total||0).toFixed(2)} ${CURRENCY}</div>
        </div>
      </div>

      <div class="oc-foot">
        <select class="status-select" data-id="${o.id}">${statusOptions}</select>
        <div style="display:flex;gap:14px;align-items:center;">
          <a class="track-link" href="${trackUrl}" target="_blank">رابط تتبع العميل ↗</a>
          ${waNumberOnly ? `<a class="wa-link" href="https://wa.me/${waNumberOnly}" target="_blank">📲 واتساب</a>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('change', (e)=>{
      const id = e.target.dataset.id;
      update(ref(db, 'orders/' + id), { status: e.target.value });
    });
  });
}

/* ==================== إدارة المنيو ==================== */
const CAT_LABELS = { appetizers:"مقبلات", mains:"أطباق رئيسية", desserts:"حلويات", drinks:"مشروبات" };
let menuItems = [];
let editingItemId = null;

async function seedMenuIfEmpty(){
  const snap = await get(ref(db, 'menu'));
  if(snap.exists()) return;
  const defaults = [
    { cat:'appetizers', ar:"بابا غنوج", en:"Baba Ghanoush", dAr:"باذنجان مشوي بالطحينة والليمون", dEn:"Smoky grilled eggplant with tahini & lemon", price:45, available:true },
    { cat:'appetizers', ar:"ورق عنب", en:"Stuffed Grape Leaves", dAr:"محشي ورق عنب بالأرز والأعشاب", dEn:"Rice & herb stuffed grape leaves", price:60, available:true },
    { cat:'mains', ar:"محشي خضار", en:"Stuffed Vegetables", dAr:"كوسة وفلفل محشي أرز باللحمة", dEn:"Zucchini & peppers stuffed with rice & meat", price:120, available:true },
    { cat:'mains', ar:"فراخ مشوية بالأعشاب", en:"Herb Grilled Chicken", dAr:"صدور فراخ متبلة ومشوية على الفحم", dEn:"Charcoal-grilled marinated chicken breast", price:150, available:true },
    { cat:'mains', ar:"كفتة بالطحينة", en:"Kofta with Tahini", dAr:"كفتة لحمة بلدي مشوية مع طحينة بيتي", dEn:"Grilled beef kofta with homemade tahini", price:140, available:true },
    { cat:'desserts', ar:"أم علي", en:"Om Ali", dAr:"حلى مصري ساخن بالمكسرات والقشطة", dEn:"Warm Egyptian bread pudding with nuts & cream", price:55, available:true },
    { cat:'desserts', ar:"بسبوسة", en:"Basbousa", dAr:"حلاوة سميد بالقطر وجوز الهند", dEn:"Semolina cake in syrup with coconut", price:40, available:true },
    { cat:'drinks', ar:"عصير مانجو طازة", en:"Fresh Mango Juice", dAr:"عصير مانجو طبيعي 100%", dEn:"100% natural mango juice", price:35, available:true },
    { cat:'drinks', ar:"شاي بالنعناع", en:"Mint Tea", dAr:"شاي بلدي بالنعناع الطازة", dEn:"Traditional tea with fresh mint", price:20, available:true }
  ];
  defaults.forEach(item=> set(push(ref(db,'menu')), item));
}

function listenToMenu(){
  onValue(ref(db, 'menu'), (snapshot)=>{
    const data = snapshot.val() || {};
    menuItems = Object.entries(data).map(([id, item])=>({ id, ...item }));
    renderMenuGroups();
  });
}

function renderMenuGroups(){
  const box = document.getElementById('menuGroups');
  if(menuItems.length === 0){
    box.innerHTML = `<div class="empty">مفيش أصناف لسه، دوس "إضافة صنف جديد"</div>`;
    return;
  }
  const cats = ['appetizers','mains','desserts','drinks'];
  box.innerHTML = cats.map(cat=>{
    const items = menuItems.filter(i=>i.cat === cat);
    if(items.length === 0) return '';
    const rows = items.map(item=>`
      <div class="menu-item-row ${item.available===false?'mi-unavailable':''}">
        <div class="mi-info">
          <div class="mi-name">${item.ar}</div>
          <div class="mi-desc">${item.dAr||''}</div>
        </div>
        <div class="mi-price nums">${item.price} ج.م</div>
        <div class="mi-actions">
          <button class="icon-btn" data-edit="${item.id}" title="تعديل">✎</button>
          <button class="icon-btn danger" data-del="${item.id}" title="حذف">🗑</button>
        </div>
      </div>`).join('');
    return `<div class="menu-cat-group"><div class="menu-cat-title">${CAT_LABELS[cat]}</div>${rows}</div>`;
  }).join('');

  box.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> openItemModal(btn.dataset.edit));
  });
  box.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('متأكد إنك عايز تحذف الصنف ده؟')){
        remove(ref(db, 'menu/' + btn.dataset.del));
      }
    });
  });
}

function openItemModal(itemId){
  editingItemId = itemId || null;
  const item = itemId ? menuItems.find(i=>i.id === itemId) : null;
  document.getElementById('modalTitle').textContent = item ? 'تعديل الصنف' : 'إضافة صنف جديد';
  document.getElementById('f-cat').value = item ? item.cat : 'appetizers';
  document.getElementById('f-ar').value = item ? item.ar : '';
  document.getElementById('f-en').value = item ? item.en : '';
  document.getElementById('f-dar').value = item ? (item.dAr||'') : '';
  document.getElementById('f-den').value = item ? (item.dEn||'') : '';
  document.getElementById('f-price').value = item ? item.price : '';
  document.getElementById('f-available').checked = item ? item.available !== false : true;
  document.getElementById('modalError').textContent = '';
  document.getElementById('itemModal').classList.add('show');
}
function closeItemModal(){
  document.getElementById('itemModal').classList.remove('show');
  editingItemId = null;
}

document.getElementById('addItemBtn').onclick = ()=> openItemModal(null);
document.getElementById('cancelItemBtn').onclick = closeItemModal;
document.getElementById('itemModal').addEventListener('click', (e)=>{
  if(e.target.id === 'itemModal') closeItemModal();
});

document.getElementById('saveItemBtn').onclick = async ()=>{
  const cat = document.getElementById('f-cat').value;
  const ar = document.getElementById('f-ar').value.trim();
  const en = document.getElementById('f-en').value.trim();
  const dAr = document.getElementById('f-dar').value.trim();
  const dEn = document.getElementById('f-den').value.trim();
  const price = parseFloat(document.getElementById('f-price').value);
  const available = document.getElementById('f-available').checked;
  const errBox = document.getElementById('modalError');

  if(!ar || !en || isNaN(price) || price < 0){
    errBox.textContent = 'من فضلك اكتب اسم الصنف بالعربي والإنجليزي وسعر صحيح';
    return;
  }

  const itemData = { cat, ar, en, dAr, dEn, price, available };
  if(editingItemId){
    await update(ref(db, 'menu/' + editingItemId), itemData);
  } else {
    await set(push(ref(db, 'menu')), itemData);
  }
  closeItemModal();
};

</script>
</body>
</html>
